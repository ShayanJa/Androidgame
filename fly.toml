# fly.toml app configuration file generated for android-poker on 2026-11-26T19:15:57-06:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'android-poker'
primary_region = 'ord'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
